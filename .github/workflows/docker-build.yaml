name: Create and publish Docker images with specific build args

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    tags:
      - v*

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io

jobs:
  build-main-image:
    runs-on:
      group: tko-canchat

    # Set a timeout for the job
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      # GitHub Packages requires the entire repository name to be in lowercase
      # although the repository owner has a lowercase username, this prevents some people from running actions after forking
      - name: Set repository and image name to lowercase
        id: image-vars
        run: |
          IMAGE_NAME_LOWER="${IMAGE_NAME,,}"
          echo "image_name=$IMAGE_NAME_LOWER" >>"$GITHUB_OUTPUT"
          echo "full_image_name=${{ env.REGISTRY }}/$IMAGE_NAME_LOWER" >>"$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: '${{ github.repository }}'

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker images (default latest tag)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.image-vars.outputs.full_image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=git-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ github.ref == 'refs/heads/main' }}
      - name: Clean up local cache until the last 2 weeks
        continue-on-error: true
        run: |
          echo "Cleaning up Docker cache..."
          docker buildx prune --filter type=local --filter until=336h --force
          echo "Overall disk usage on the cache volume:"
          df -h /var/lib/docker/cache
      - name: Build Docker image (latest)
        uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          # outputs: type=image,name=${{ steps.image-vars.outputs.full_image_name }},push-by-digest=true,name-canonical=true,push=true
          cache-to: type=local,dest=/var/lib/docker/cache,mode=max
          cache-from: type=local,src=/var/lib/docker/cache
          build-args: |
            BUILD_HASH=${{ github.sha }}
            UID=1001
            GID=1001
          tags: ${{ steps.meta.outputs.tags }}
