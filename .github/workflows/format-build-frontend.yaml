name: Frontend Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: 'Format & Build Frontend'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22' # Or specify any other version you want to use

      - name: Install Dependencies
        run: npm install

      - name: Test Frontend
        run: npm run test:frontend -- --run

      - name: Install accessibility test browser
        run: npx playwright install --with-deps chromium

      - name: Test accessibility styles
        run: npx playwright test playwright/tests/e2e/accessibility --project=chromium-en --no-deps --reporter=list

      - name: Format Frontend
        run: npm run format

      - name: Run i18next
        run: npm run i18n:parse

      - name: Check for Changes After Format
        run: git diff --exit-code

      - name: Build Frontend
        run: npm run build
