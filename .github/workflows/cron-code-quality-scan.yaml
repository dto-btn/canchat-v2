---
name: Code Quality Scan

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cron-code-quality-scan.yaml"
      - ".bandit.yaml"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  bearer-scan:
    name: Bearer code quality scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Bearer
        id: scan
        shell: bash
        env:
          BEARER_VERSION: "2.0.2@sha256:b3482c311044d9dd0dc98e929bd08fa38a2ef75a4190af0a093de2b62cc76b21"
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            "docker.io/bearer/bearer:${BEARER_VERSION}" \
            scan . \
            --severity critical,high \
            --format sarif \
            --hide-progress-bar \
            --exit-code 0 \
            > "$RUNNER_TEMP/bearer.sarif"

      - name: Validate SARIF report
        shell: bash
        run: |
          set -euo pipefail

          jq -e '
            .version == "2.1.0" and
            (.runs | type == "array" and length > 0)
          ' "$RUNNER_TEMP/bearer.sarif" > /dev/null

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/bearer.sarif
          category: bearer

  trivy-scan:
    name: Trivy code quality scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy
        id: scan
        shell: bash
        env:
          TRIVY_VERSION: "0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb"
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            "ghcr.io/aquasecurity/trivy:${TRIVY_VERSION}" \
            fs \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --format sarif \
            --no-progress \
            --exit-code 0 \
            . > "$RUNNER_TEMP/trivy.sarif"

      - name: Validate SARIF report
        shell: bash
        run: |
          set -euo pipefail

          jq -e '
            .version == "2.1.0" and
            (.runs | type == "array" and length > 0)
          ' "$RUNNER_TEMP/trivy.sarif" > /dev/null

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: trivy

  bandit-scan:
    name: Bandit code quality scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Bandit
        id: scan
        shell: bash
        env:
          BANDIT_VERSION: "1.9.4"
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/bandit"

          "$RUNNER_TEMP/bandit/bin/pip" install \
            "bandit[sarif]==${BANDIT_VERSION}"

          "$RUNNER_TEMP/bandit/bin/bandit" \
            -r . \
            -c .bandit.yaml \
            --severity-level high \
            --confidence-level high \
            --format sarif \
            --exit-zero \
            --output "$RUNNER_TEMP/bandit.sarif"

      - name: Validate SARIF report
        shell: bash
        run: |
          set -euo pipefail

          jq -e '
            .version == "2.1.0" and
            (.runs | type == "array" and length > 0) and
            ([
              .runs[].invocations[]? |
              (
                .toolConfigurationNotifications[]?,
                .toolExecutionNotifications[]?
              ) |
              select(.level == "error")
            ] | length == 0)
          ' "$RUNNER_TEMP/bandit.sarif" > /dev/null

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/bandit.sarif
          category: bandit