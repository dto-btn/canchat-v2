name: Testing - Playwright

on:
  workflow_dispatch:
    inputs:
      ref_name:
        description: 'Override branch name'
        type: string
        required: false
        default: ''
  workflow_run:
    workflows: ["Create and publish Docker images with specific build args"]
    branches:
        - dev
        - main
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io

jobs:
  tests:
    name: 'Playwright E2E Tests'
    runs-on:
      group: tko-canchat
    permissions:
      contents: read
      packages: read
      attestations: read
      id-token: write

    timeout-minutes: 120
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --add-host host.docker.internal:host-gateway

    steps:
      - name: Checkout CANChat-V2
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Override ref_name
        id: ref_name
        run: |
          if [ -n "${{ github.event.inputs.ref_name }}" ]; then
            echo "ref_name=${{ github.event.inputs.ref_name }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.workflow_run.head_branch }}" ]; then
            echo "ref_name=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          else
            echo "ref_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Restore Hugging Face model cache
        id: hf-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache/huggingface
            .cache/torch
          key: canchat-hf-model-cache-${{ steps.ref_name.outputs.ref_name }}-v1
          restore-keys: |
            canchat-hf-model-cache-${{ steps.ref_name.outputs.ref_name }}-
            canchat-hf-model-cache-

      - name: Force local Docker image update
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' | xargs -I {} bash -c 'docker inspect --format="{{index .RepoDigests 0}}" {} && docker pull {};';
          docker image prune -f
        continue-on-error: true

      - name:  Start CANChat Environment
        run: |
            mkdir -p "$GITHUB_WORKSPACE/.cache/huggingface" "$GITHUB_WORKSPACE/.cache/torch"

            docker run -d -p 8080:8080 \
            --add-host=host.docker.internal:host-gateway \
            --name canchat \
            --rm \
            -v "$GITHUB_WORKSPACE/.cache/huggingface:/cache/huggingface" \
            -v "$GITHUB_WORKSPACE/.cache/torch:/cache/torch" \
            -e HF_HOME=/cache/huggingface \
            -e HF_HUB_CACHE=/cache/huggingface/hub \
            -e TRANSFORMERS_CACHE=/cache/huggingface/transformers \
            -e SENTENCE_TRANSFORMERS_HOME=/cache/huggingface/sentence-transformers \
            -e TORCH_HOME=/cache/torch \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/canchat-v2:${{ steps.ref_name.outputs.ref_name }} \
            /bin/bash -c 'echo "${{ secrets.E2E_ENV_FILE }}" | base64 --decode > ../.env && \
              echo "0DK/YlAjXSrYKdoH" > ../.webui_secret_key && \
              unset OPENAI_API_KEY && \
              unset OPENAI_API_BASE_URL && \
              unset WEBUI_SECRET_KEY && \
              unset USE_RERANKING_MODEL_DOCKER && \
              unset RAG_RERANKING_MODEL && \
              bash start.sh'

      - name:  Copy env variables
        run: echo "${{ secrets.E2E_ENV_FILE }}" | base64 --decode > .env

      - name:  Set up Node dependencies & build
        run:  |
          npm ci
          npm run test:setup:headless


      - name: Wait for CANChat to be ready
        run: |
          for i in {1..300}; do
            if [ -z $(docker ps --filter "name=canchat" --filter "health=healthy" --format '{{.Names}}') ]; then
              echo "Waiting for CANChat..."
              sleep 5
            else
              echo "CANChat is ready."
              exit 0
            fi

          done
          echo "CANChat failed to start in time" >&2
          exit 1

      - name: Save Hugging Face model cache
        if: steps.hf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/huggingface
            .cache/torch
          key: ${{ steps.hf-cache.outputs.cache-primary-key }}

      - name: Start Playwright Tests (Parallel)
        env:
          REUSE_EXISTING_SERVER: true
        run: |
          bash -c 'env $(grep -v "^#" "${ENV_FILE:-.env}"| xargs) PLAYWRIGHT_BLOB_OUTPUT_DIR=./blob-report-parallel npx playwright test --grep-invert @serial --reporter=blob'

      - name: Start Playwright Tests (Serial)
        if: always()
        env:
          REUSE_EXISTING_SERVER: true
        run: |
          bash -c 'env $(grep -v "^#" "${ENV_FILE:-.env}"| xargs) PLAYWRIGHT_BLOB_OUTPUT_DIR=./blob-report-serial npx playwright test --grep @serial --workers=1 --reporter=blob'

      - name: Merge Playwright Reports
        if: always()
        run: |
          mkdir -p ./all-blob-reports
          cp -r ./blob-report-parallel/* ./all-blob-reports/ || true
          cp -r ./blob-report-serial/* ./all-blob-reports/ || true

          PLAYWRIGHT_JSON_OUTPUT_NAME=results.json npx playwright merge-reports --reporter=html,json ./all-blob-reports
          mkdir -p playwright-report
          mv results.json playwright-report/results.json || true

      - name: Get timestamp
        id: timestamps
        shell: bash
        run: |
          echo "timestamp=$(/bin/date -u "+%Y%m%d_%H%M%S")" >> $GITHUB_OUTPUT

      - name: Upload Report
        id: upload_report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ steps.timestamps.outputs.timestamp }}
          path: ./playwright-report/
          retention-days: 30
      
      - name: Create results summary
        uses: daun/playwright-report-summary@v4
        if: ${{ !cancelled() }}
        id: playwright_summary
        with:
          report-file: ./playwright-report/results.json
          create-comment: false
 
      - name: Output test summary to action
        if: ${{ !cancelled() }}
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Playwright Report" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.playwright_summary.outputs.summary }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Download Playwright Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload_report.outputs.artifact-id }})"  >> $GITHUB_STEP_SUMMARY
