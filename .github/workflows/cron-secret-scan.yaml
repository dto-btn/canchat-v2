---
name: Secret scanning

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/trufflehog-knownSecrets.txt"
      - ".github/workflows/cron-secret-scan.yaml"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  secret-scan:
    name: Secret scan default branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run TruffleHog
        id: scan
        shell: bash
        env:
          TRUFFLEHOG_VERSION: "3.99.7@sha256:0d003fc3abc4e1565eca8462b992001314de51451e96e3c44de80d116794d5d1"
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            "ghcr.io/trufflesecurity/trufflehog:${TRUFFLEHOG_VERSION}" \
            git file:///repo \
            --branch HEAD \
            --results=verified,unverified,unknown \
            --no-update \
            --fail-on-scan-errors \
            --sarif > "$RUNNER_TEMP/trufflehog.sarif"

      - name: Evaluate findings
        shell: bash
        run: |
          set -euo pipefail

          failed=0
          knownSecrets=".github/trufflehog-knownSecrets.txt"
          findings="$RUNNER_TEMP/trufflehog-findings.txt"

          jq -r '
            .runs[].results[] |
            [
              (.partialFingerprints["trufflehogFingerprint/v1"] // "missing-fingerprint"),
              .ruleId,
              .locations[0].physicalLocation.artifactLocation.uri,
              (.locations[0].physicalLocation.region.startLine // 0 | tostring)
            ] | @tsv
          ' "$RUNNER_TEMP/trufflehog.sarif" > "$findings"

          while IFS=$'\t' read -r fingerprint detector file line; do
            if [[ "$fingerprint" == "missing-fingerprint" ]] ||
               ! grep -Fxq -- "$fingerprint" "$knownSecrets"; then
              echo "::error::Unapproved secret: $detector | $file:$line | $fingerprint"
              failed=1
            fi
          done < "$findings"

          if (( failed )); then
            echo "New secrets detected."
            exit 1
          fi

          echo "No unapproved secrets detected."

      - name: Upload SARIF to GitHub
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/trufflehog.sarif
          category: trufflehog